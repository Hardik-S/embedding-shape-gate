[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-shape-gate"
version = "0.1.0"
description = "Offline validator for synthetic embedding fixture dimensions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Embedding Shape Gate contributors"}]

[project.scripts]
embedding-shape-gate = "embedding_shape_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
