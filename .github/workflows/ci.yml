name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest .
      - run: python -m pytest -q
      - run: embedding-shape-gate --help
      - shell: bash
        run: |
          embedding-shape-gate examples/rows.jsonl examples/policy.json > result.json || test "$?" -eq 1
          grep -q '"status":"shape_issues"' result.json
